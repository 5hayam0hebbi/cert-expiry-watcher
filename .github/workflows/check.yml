# Runs the tests on every push, and checks every certificate each morning.
# If any certificate needs attention, it opens (or updates) one GitHub Issue.
name: cert-check

on:
  push:
  workflow_dispatch:          # adds a "Run workflow" button on the Actions tab
  schedule:
    - cron: "17 11 * * *"     # every day at 11:17 UTC (7:17 a.m. Toronto time in summer)

permissions:
  contents: read
  issues: write               # lets the job open and comment on issues

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check . && ruff format --check .
      - run: pytest -v

      - name: Check certificates
        id: certs
        run: |
          set +e
          python certwatch.py endpoints.txt --report report.md --json results.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the alert issue
        if: steps.certs.outputs.exit_code != '0' && github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create cert-alert --color B60205 --force
          number=$(gh issue list --label cert-alert --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Certificate check: endpoints need attention" --label cert-alert --body-file report.md
          fi
